# Tests run against an in-memory H2 database in MySQL compatibility mode so
# the MySQL-flavoured column definitions (e.g. MEDIUMBLOB) keep working.
spring.datasource.url=jdbc:h2:mem:holidayrecipes;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
